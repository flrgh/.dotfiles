[tools]
node = "latest"
go = "latest"
zig = "latest"
python = "latest"

ast-grep = "latest"
aws-cli = "latest"
bat = "latest"
bazelisk = "latest"
bitwarden = "latest"
cargo-binstall = "latest"
cosign = "latest"
delta = "latest"
direnv = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
git-cliff = "latest"
jq = "latest"
lsd = "latest"
marksman = "latest"
ninja = "latest"
ripgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
terraform-ls = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest"
vivid = "latest"
xh = "latest"
yq = "latest"
zls = "latest"
tombi = "latest"
htmlq = "latest"
yamlfmt = "latest"
claude-code = "latest"
bun = "latest"
"aqua:docker/buildx" = "latest"
"github:docker/docker-language-server" = { version = "latest", bin = "docker-language-server" }
"github:docker/docker-credential-helpers" = { version = "latest", asset_pattern = "docker-credential-secretservice-*linux-amd64", bin = "docker-credential-secretservice" }
"github:AnalogJ/scrutiny" = { version = "latest", asset_pattern = "scrutiny-collector-metrics-linux-amd64", bin = "scrutiny-collector" }
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/jstemmer/gotags" = "latest"

# with = "latest" mise ends up installing the oldest version, so here we are
"go:code.gitea.io/tea" = "0.14.1"

tmux = "latest"
codex = "latest"
deno = "latest"
age = "latest"
packer = "latest"
opentofu = "latest"
kubectl = "latest"
promtool = "latest"
# pnpm's install root contains a `dist/` directory, and mise seems to think
# this is an executable, causing it to shadow `cargo-dist`'s `dist` bin.
# Enabling `symlink_bins` fixes the `dist/` overreach but breaks the pnpm bin
# link for some reason, so we have to symlink it ourself :(
pnpm = { version = "latest", symlink_bins = true, postinstall = "ln -sfn ../pnpm \"$MISE_TOOL_INSTALL_PATH/.mise-bins/pnpm\"" }
action-validator = "latest"
actionlint = "latest"
"npm:@tree-sitter-grammars/tree-sitter-lua" = "latest"
"npm:awk-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:gh-actions-language-server" = "latest"
"npm:live-server" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:pyright" = "latest"
"npm:sql-language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:vscode-json-languageserver" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:compiledb" = "latest"
# these options allow install without pulling in an OpenSSL source build,
# which requires a bunch of OS packages I don't want to install
"cargo:cargo-release" = { version = "latest", default-features = false, features = "vendored-libgit2" }
"cargo:cargo-local" = "latest"
"cargo:cargo-dist" = "latest"
"cargo:cargo-bloat" = "latest"
"cargo:cargo-bp" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-update" = "latest"
"cargo:cargo-expand" = "latest"
"cargo:cargo-cache" = "latest"
"cargo:cargo-modules" = "latest"
"cargo:bindgen-cli" = "latest"
"cargo:cbindgen" = "latest"
"cargo:inferno" = "latest"
"cargo:html-to-markdown-cli" = "latest"
"cargo:systemd-lsp" = "latest"
"cargo:minijinja-cli" = "latest"
"cargo:cross" = "latest"
"cargo:alacritty" = "latest"
tokei = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"

[settings]
# everything but aqua is disabled until I actually need something from
# another backend
disable_backends = [
    #"aqua",
    "asdf",
    #"cargo",
    "conda",
    #"core",
    "dotnet",
    "forgejo",
    "gem",
    #"github",
    #"gitlab",
    #"go",
    #"http",
    #"npm",
    #"pipx",
    "s3",
    "spm",
    "ubi",
    "vfox",
]
paranoid = true
experimental = true

github_attestations = true
gpg_verify = true

minimum_release_age = "7d"

ceiling_paths = [
    "/home"
]

no_hooks = true
not_found_auto_install = false

trusted_config_paths = [
    "~/git/flrgh"
]
lockfile_platforms = ["linux-x64", "linux-x64-musl", "linux-arm64", "linux-arm64-musl"]

[settings.cargo]
binstall = true

[settings.pipx]
uvx = true

[settings.aqua]
# enable all the security things
slsa = true
cosign = true
minisign = true
github_attestations = true

[settings.node]
gpg_verify = true

[settings.npm]
package_manager = "npm"

[settings.github]
github_attestations = true
slsa = true
credential_command = "secrets get --cache bws://main/github-readonly-pat"
