[tools]
"aqua:docker/buildx" = "0.36.1"

"cargo:alacritty" = "0.17.0"
"cargo:bindgen-cli" = "0.72.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-bloat" = "0.12.1"
"cargo:cargo-bp" = "0.6.1"
"cargo:cargo-cache" = "0.8.3"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dist" = "0.32.0"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-expand" = "1.0.126"
"cargo:cargo-local" = "0.4.0"
"cargo:cargo-modules" = "0.27.0"
"cargo:cargo-outdated" = "0.19.0"
# these options allow install without pulling in an OpenSSL source build,
# which requires a bunch of OS packages I don't want to install
"cargo:cargo-release" = { version = "1.1.5", default-features = "false", features = "vendored-libgit2" }
"cargo:cargo-update" = "22.1.1"
"cargo:cbindgen" = "0.29.4"
"cargo:cross" = "0.2.5"
"cargo:html-to-markdown-cli" = "3.11.3"
"cargo:inferno" = "0.12.8"
"cargo:minijinja-cli" = "2.24.0"
"cargo:systemd-lsp" = "0.2.0"

"github:AnalogJ/scrutiny" = { version = "0.9.3", asset_pattern = "scrutiny-collector-metrics-linux-amd64", bin = "scrutiny-collector" }
"github:docker/docker-credential-helpers" = { version = "0.9.8", asset_pattern = "docker-credential-secretservice-*linux-amd64", bin = "docker-credential-secretservice" }
"github:docker/docker-language-server" = { version = "0.20.1", bin = "docker-language-server" }

"go:gitea.dev/tea" = "0.15.1"
"go:github.com/jstemmer/gotags" = "1.4.1"
"go:golang.org/x/tools/gopls" = "0.23.0"

"npm:@tree-sitter-grammars/tree-sitter-lua" = "0.4.1"
"npm:awk-language-server" = "0.10.6"
"npm:bash-language-server" = "5.6.0"
"npm:gh-actions-language-server" = "0.0.3"
"npm:live-server" = "1.2.2"
"npm:pyright" = "1.1.413"
"npm:sql-language-server" = "1.7.1"
"npm:typescript" = "7.0.2"
"npm:typescript-language-server" = "6.0.0"
"npm:vscode-json-languageserver" = "1.3.4"
"npm:yaml-language-server" = "1.24.0"
"pipx:compiledb" = "0.10.7"

action-validator = "0.9.0"
actionlint = "1.7.12"
age = "1.3.1"
ast-grep = "0.45.1"
aws-cli = { version = "2.36.33", symlink_bins = "true" }
bat = "0.26.1"
bazelisk = "1.29.0"
bun = "1.4.0"
cargo-binstall = "1.21.1"
cosign = "3.1.3"
delta = "0.19.2"
deno = "2.9.6"
direnv = "2.37.1"
fd = "10.4.2"
fzf = "0.74.3"
gh = "2.98.0"
git-cliff = "2.13.1"
go = "1.27.0"
htmlq = "0.4.0"
jq = "1.8.2"
kubectl = "1.36.4"
lsd = "1.2.0"
marksman = "2026-02-08"
ninja = "1.13.2"
node = "26.7.0"
opentofu = "1.12.6"
packer = "1.16.0"
# pnpm's install root contains a `dist/` directory, and mise seems to think
# this is an executable, causing it to shadow `cargo-dist`'s `dist` bin.
# Enabling `symlink_bins` fixes the `dist/` overreach but breaks the pnpm bin
# link for some reason, so we have to symlink it ourself :(
pnpm = { version = "11.22.0", symlink_bins = "true", postinstall = 'ln -sfn ../pnpm "$MISE_TOOL_INSTALL_PATH/.mise-bins/pnpm"' }
promtool = "3.14.0"
python = "3.14.7"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"
terraform-ls = "0.39.0"
tmux = "3.7b"
tokei = "14.0.0"
tombi = "1.4.0"
tree-sitter = "0.26.12"
usage = "5.1.0"
uv = "0.12.5"
vivid = "0.11.1"
xh = "0.26.2"
yamlfmt = "0.21.0"
yq = "4.53.6"
zig = "0.16.0"
zls = "0.16.0"


[settings]
# everything but aqua is disabled until I actually need something from
# another backend
disable_backends = [
    #"aqua",
    "asdf",
    #"cargo",
    "conda",
    #"core",
    "dotnet",
    "forgejo",
    "gem",
    #"github",
    #"gitlab",
    #"go",
    #"http",
    #"npm",
    #"pipx",
    "s3",
    "spm",
    "ubi",
    "vfox",
]
paranoid = true
experimental = true

github_attestations = true
gpg_verify = true

minimum_release_age = "7d"

ceiling_paths = [
    "/home"
]

no_hooks = true
not_found_auto_install = false

trusted_config_paths = [
    "~/git/flrgh"
]
lockfile_platforms = ["linux-x64", "linux-x64-musl", "linux-arm64", "linux-arm64-musl"]

[settings.cargo]
binstall = true

[settings.pipx]
uvx = true

[settings.aqua]
# enable all the security things
slsa = true
cosign = true
minisign = true
github_attestations = true

[settings.node]
gpg_verify = true

[settings.npm]
package_manager = "npm"

[settings.github]
github_attestations = true
slsa = true
credential_command = "secrets get --cache bws://main/github-readonly-pat"
